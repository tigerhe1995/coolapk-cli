[project]
name = "coolapk-cli"
version = "1.0.0"
description = "酷安官方接口的非官方客户端：CLI + MCP 服务，供 AI agent 读取和发布酷安内容"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28", "bcrypt>=4.0"]

[project.scripts]
coolapk = "coolapk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coolapk"]

[tool.setuptools.package-data]
coolapk = ["auth_blob.b64"]
